<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Komando 90</title>
<meta name="description" content="90 günlük 3 fazlı kalistenik + rucking antrenman takip uygulaması.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Komando 90">
<meta name="theme-color" content="#f3efe2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12140d" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
html{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
img{max-width:100%;}

:root{
  --bg:#f3efe2;
  --surface:#ffffff;
  --surface-2:#eae3ce;
  --text:#20241a;
  --text-dim:#63684f;
  --olive:#4a5638;
  --olive-2:#5d6b46;
  --accent:#c9662b;
  --accent-2:#e08a3f;
  --line:#ddd4b8;
  --success:#4c7a44;
  --success-bg:#e2ecdc;
  --danger:#b3462c;
  --danger-bg:#f3e0d8;
  --shadow:0 1px 2px rgba(32,36,26,.07),0 6px 20px rgba(32,36,26,.08);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12140d;
    --surface:#1b1f15;
    --surface-2:#242a1a;
    --text:#eee8d6;
    --text-dim:#9a9c84;
    --olive:#93a879;
    --olive-2:#a7bb8d;
    --accent:#e6923f;
    --accent-2:#f2ac5f;
    --line:#333a26;
    --success:#82b26c;
    --success-bg:#20301c;
    --danger:#e28158;
    --danger-bg:#3a241c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#12140d; --surface:#1b1f15; --surface-2:#242a1a; --text:#eee8d6; --text-dim:#9a9c84;
  --olive:#93a879; --olive-2:#a7bb8d; --accent:#e6923f; --accent-2:#f2ac5f; --line:#333a26;
  --success:#82b26c; --success-bg:#20301c; --danger:#e28158; --danger-bg:#3a241c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;}
h1,h2,h3,.disp{font-family:'Oswald',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em;}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:9px;font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:.06em;color:var(--olive);}
.brand-mark{font-size:20px;filter:saturate(0) opacity(.85);}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
.icon-btn:active{transform:scale(.94);}
main#view{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.bottomnav-inner{max-width:560px;margin:0 auto;display:flex;}
.navbtn{flex:1;background:none;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;}
.navbtn .ni{font-size:19px;line-height:1;}
.navbtn.active{color:var(--accent);}
/* ---- generic components ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.eyebrow{font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--text-dim);}
.pill.accent{background:color-mix(in srgb, var(--accent) 16%, var(--surface));color:var(--accent);}
.pill.success{background:var(--success-bg);color:var(--success);}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn.primary{background:var(--accent);color:#fff8ef;}
.btn.primary:active{background:var(--accent-2);}
.btn.ghost{background:var(--surface-2);color:var(--text);}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn:disabled{opacity:.55;}
a.ytbtn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--text);text-decoration:none;border:1px solid var(--line);}
a.ytbtn:active{background:var(--line);}
a.ytbtn .yicon{width:15px;height:15px;flex:0 0 auto;}
button.rest-btn{border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--text);border:1px solid var(--line);cursor:pointer;min-width:96px;font-variant-numeric:tabular-nums;}
button.rest-btn.running{background:color-mix(in srgb, var(--accent) 18%, var(--surface));color:var(--accent);border-color:var(--accent);}
button.rest-btn.done-flash{background:var(--success-bg);color:var(--success);border-color:var(--success);}
/* ---- onboarding / sheet ---- */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb, #000 45%, transparent);display:flex;align-items:flex-end;justify-content:center;}
.sheet-panel{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
input[type=date]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
/* ---- today view ---- */
.hero{background:linear-gradient(155deg, var(--olive), var(--olive-2));border-radius:20px;padding:20px;color:#f7f5ea;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 16px);pointer-events:none;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;}
.hero-daynum{font-family:'Oswald',sans-serif;font-size:40px;font-weight:700;line-height:1;letter-spacing:.01em;}
.hero-sub{font-size:12px;opacity:.85;margin-top:4px;}
.hero-phase{font-size:12.5px;font-weight:600;opacity:.92;}
.progressbar{height:6px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:14px;}
.progressbar > i{display:block;height:100%;background:#f4c77e;border-radius:999px;}
.stat-row{display:flex;gap:10px;margin-top:18px;position:relative;}
.stat-chip{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:9px 10px;}
.stat-chip b{display:block;font-family:'Oswald',sans-serif;font-size:16px;}
.stat-chip span{font-size:10.5px;opacity:.85;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
.section-title h2{font-size:15px;font-weight:600;margin:0;color:var(--text);}
.daytype{font-size:13px;color:var(--text-dim);margin-top:2px;}
.exlist{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.exrow{display:flex;flex-direction:column;gap:11px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
.exrow.done{background:var(--success-bg);border-color:color-mix(in srgb, var(--success) 40%, var(--line));}
.exrow-top{display:flex;gap:12px;}
.pictogram{width:44px;height:44px;flex:0 0 auto;color:var(--olive);}
.exrow.done .pictogram{color:var(--success);}
.exbody{flex:1;min-width:0;}
.exname{font-weight:600;font-size:14.5px;}
.exdetail{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
.exnote{font-size:11.5px;color:var(--accent);margin-top:3px;font-weight:600;}
.exmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center;}
.setpips{display:flex;gap:5px;}
.pip{flex:1;height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);}
.pip.filled{background:var(--success);border-color:var(--success);}
.advance-btn{width:100%;border:none;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--olive);color:#f7f5ea;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.03em;font-size:14px;cursor:pointer;}
.advance-btn:active{transform:scale(.985);}
.advance-btn .ab-progress{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap;}
.exrow.done .advance-btn{background:var(--success);}
.restday-card{text-align:center;padding:34px 20px;}
.restday-card .ri{font-size:34px;}
.restday-card h3{margin:10px 0 6px;font-size:16px;}
.restday-card p{font-size:13px;color:var(--text-dim);margin:0;line-height:1.5;}
.future-card,.done-card{text-align:center;padding:34px 20px;}
.future-card .fi,.done-card .fi{font-size:32px;}
/* ---- program view ---- */
.segmented{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;}
.month-tab{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:9px;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--text-dim);cursor:pointer;}
.month-tab.active{background:var(--surface);color:var(--olive);box-shadow:var(--shadow);}
.month-info{margin-top:14px;padding:14px;}
.month-info h3{margin:2px 0 6px;font-size:16px;}
.month-info p{font-size:12.5px;color:var(--text-dim);margin:0 0 8px;line-height:1.5;}
.daycard{margin-top:10px;overflow:hidden;}
.day-head{display:flex;align-items:center;justify-content:space-between;padding:14px;cursor:pointer;gap:10px;}
.day-head .dh-left{display:flex;align-items:center;gap:11px;min-width:0;}
.day-badge{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:12px;color:var(--olive);flex:0 0 auto;}
.daycard.today .day-badge{background:var(--accent);color:#fff;}
.dh-name{font-weight:600;font-size:14px;}
.dh-type{font-size:12px;color:var(--text-dim);margin-top:1px;}
.chev{font-size:12px;color:var(--text-dim);transition:transform .2s;flex:0 0 auto;}
.daycard.open .chev{transform:rotate(180deg);}
.day-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.daycard.open .day-body{max-height:2000px;}
.day-body-inner{padding:0 14px 14px;}
.day-note{font-size:11.5px;color:var(--text-dim);margin:-2px 0 10px;font-style:italic;}
/* ---- progress view ---- */
.statgrid{display:flex;gap:10px;}
.statcard{flex:1;padding:14px;text-align:center;}
.statcard b{display:block;font-family:'Oswald',sans-serif;font-size:22px;color:var(--olive);}
.statcard span{font-size:11px;color:var(--text-dim);}
.dotgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:16px;}
.dot{aspect-ratio:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);}
.dot.done{background:var(--success);border-color:var(--success);}
.dot.today{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
.dot.missed{background:var(--danger-bg);border-color:var(--danger);}
.dot.rest{background:transparent;border-style:dashed;}
.dot.future{opacity:.5;}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 14px 14px;font-size:11px;color:var(--text-dim);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
.phasebars{display:flex;flex-direction:column;gap:12px;padding:14px;}
.phaserow .pr-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px;}
.pr-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.pr-track > i{display:block;height:100%;background:var(--olive);border-radius:999px;}
/* ---- pictogram animation ---- */
@media (prefers-reduced-motion:reduce){.pictogram *{animation:none!important;}}
.cat-pullup .move{animation:pullMove 1.5s ease-in-out infinite;transform-origin:50px 26px;}
@keyframes pullMove{0%,100%{transform:translateY(0)}50%{transform:translateY(11px)}}
.cat-pushup .move{animation:pushMove 1.5s ease-in-out infinite;transform-origin:50px 60px;}
@keyframes pushMove{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.cat-dip .move{animation:pullMove 1.4s ease-in-out infinite;transform-origin:50px 30px;}
.cat-core .legs{animation:coreMove 1.6s ease-in-out infinite;transform-origin:38px 62px;}
@keyframes coreMove{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-38deg)}}
.cat-squat .move{animation:squatMove 1.6s ease-in-out infinite;transform-origin:50px 88px;}
@keyframes squatMove{0%,100%{transform:translateY(0)}50%{transform:translateY(13px)}}
.cat-lunge .front{animation:lungeMove 1.5s ease-in-out infinite;transform-origin:46px 62px;}
@keyframes lungeMove{0%,100%{transform:translateX(0)}50%{transform:translateX(-9px)}}
.cat-jump .move{animation:jumpMove 1s ease-in-out infinite;}
@keyframes jumpMove{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.cat-ruck .legL{animation:walkL 1.1s ease-in-out infinite;transform-origin:50px 62px;}
.cat-ruck .legR{animation:walkR 1.1s ease-in-out infinite;transform-origin:50px 62px;}
@keyframes walkL{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes walkR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.cat-rest .zz{animation:zPulse 2s ease-in-out infinite;}
@keyframes zPulse{0%,100%{opacity:.25}50%{opacity:1}}
[hidden]{display:none!important;}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🪖</span><span>KOMANDO 90</span></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Ayarlar">⚙</button>
  </header>

  <main id="view"></main>

  <nav class="bottomnav">
    <div class="bottomnav-inner">
      <button class="navbtn active" data-tab="today"><span class="ni">◎</span>Bugün</button>
      <button class="navbtn" data-tab="program"><span class="ni">▤</span>Program</button>
      <button class="navbtn" data-tab="progress"><span class="ni">◈</span>İlerleme</button>
    </div>
  </nav>
</div>

<div class="overlay" id="onboarding" hidden>
  <div class="sheet-panel">
    <div class="eyebrow">Yeni Program</div>
    <h2 style="margin:6px 0 8px;font-size:20px;">90 Günlük Protokole Başla</h2>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.6;margin:0 0 18px;">Kalistenik gücü, rucking kondisyonuyla birleştiren 3 fazlı programın burada başlıyor. İlerlemen bu cihazda saklanır.</p>
    <div class="field">
      <label for="startDateInput">Başlangıç Tarihi</label>
      <input type="date" id="startDateInput">
    </div>
    <button class="btn primary" id="startProgramBtn" style="width:100%;margin-top:16px;">Programı Başlat</button>
  </div>
</div>

<div class="overlay" id="settingsSheet" hidden>
  <div class="sheet-panel">
    <div class="eyebrow">Ayarlar</div>
    <h2 style="margin:6px 0 14px;font-size:18px;">Program Ayarları</h2>
    <div class="field">
      <label for="settingsDateInput">Başlangıç Tarihi</label>
      <input type="date" id="settingsDateInput">
    </div>
    <button class="btn primary" id="saveSettingsBtn" style="width:100%;margin-top:14px;">Kaydet</button>
    <button class="btn outline" id="resetBtn" style="width:100%;margin-top:10px;">Programı Sıfırla</button>
    <div id="resetConfirm" hidden style="margin-top:10px;font-size:12px;color:var(--danger);text-align:center;">Tüm ilerleme silinecek. Emin misen tekrar dokun ↑</div>
    <button class="btn ghost" id="closeSettingsBtn" style="width:100%;margin-top:10px;">Kapat</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= DATA ================= */
var m1_pzt=[
  {name:"Barfiks (Nizami + Negatif)",cat:"pullup",detail:"4 Set × (3 Nizami + 3 Negatif Tekrar)",rest:90,sets:4,yt:"barfiks çekme tekniği negatif barfiks"},
  {name:"Şınav",cat:"pushup",detail:"4 Set × 15 Tekrar",rest:60,sets:4,yt:"doğru şınav formu"},
  {name:"Dips (Sandalye / Bar)",cat:"dip",detail:"4 Set × 10 Tekrar",rest:60,sets:4,yt:"sandalyede dips hareketi"},
  {name:"Lying Leg Raise / Plank",cat:"core",detail:"3 Set × 15 Tekrar veya 45 Saniye",rest:45,sets:3,yt:"lying leg raise ve plank tekniği"}
];

  {name:"Calf Raise / Burpee",cat:"jump",detail:"4 Set × 25 Tekrar (Calf) veya 3 Set × 10 Tekrar (Burpee)",rest:60,sets:4,yt:"calf raise ve burpee tekniği"}
];
var m1_car=[{name:"Ağırlık Yelekli Yürüyüş (Rucking)",cat:"ruck",detail:"40 Dakika — Normal Tempo",rest:0,sets:1,yt:"rucking ağırlık yelekli yürüyüş rehberi"}];
var m1_cmt=[{name:"Ağırlık Yelekli Yürüyüş",cat:"ruck",detail:"40–50 Dakika — Normal Tempo, Aktif Yağ Yakımı",rest:0,sets:1,yt:"rucking yağ yakımı yürüyüşü"}];

  {name:"Geniş Tutuş Şınav",cat:"pushup",detail:"4 Set × 20 Tekrar",rest:60,sets:4,yt:"geniş tutuş şınav tekniği"},
  {name:"Dips (Paralel Bar)",cat:"dip",detail:"4 Set × 12 Tekrar",rest:60,sets:4,yt:"paralel barda dips tekniği"},
  {name:"Elmas (Diamond) Şınav",cat:"pushup",detail:"3 Set × 10 Tekrar (Triceps için)",rest:60,sets:3,yt:"diamond push up elmas şınav"}
];
var m2_sal=[
  {name:"Zıplamalı Squat (Jump Squat)",cat:"jump",detail:"4 Set × 15 Tekrar",rest:60,sets:4,yt:"jump squat tekniği"},
  {name:"Bulgarian Split Squat",cat:"lunge",detail:"3 Set × 12 Tekrar (Her bacak)",rest:60,sets:3,yt:"bulgarian split squat tekniği"},
  {name:"Hanging Knee Raise (Barda Karın)",cat:"core",detail:"4 Set × 12 Tekrar",rest:45,sets:4,yt:"hanging knee raise barda karın hareketi"}
];
var m2_car=[{name:"Ağırlık Yelekli Yürüyüş (Rucking)",cat:"ruck",detail:"50 Dakika — Kondisyon Arttı",rest:0,sets:1,yt:"rucking kondisyon geliştirme"}];
var m2_cmt=[{name:"Rucking + Sprint",cat:"ruck",detail:"50 Dakika — Yürüyüş içinde 3 × 1 dakika sprint/depar",rest:0,sets:1,yt:"rucking sprint interval antrenmanı"}];
var m2_cum=m2_sal.concat([{name:"Akşam Yelekli Yürüyüş",cat:"ruck",detail:"45 Dakika",rest:0,sets:1,yt:"akşam rucking yürüyüşü"}]);

var m3_pzt=[

/* ================= STATE / STORAGE ================= */
var LS_START="k90_start", LS_PROG="k90_progress";
function loadStart(){ try{ return localStorage.getItem(LS_START); }catch(e){ return null; } }
function saveStart(v){ try{ localStorage.setItem(LS_START,v); }catch(e){} }
function loadProgress(){ try{ var raw=localStorage.getItem(LS_PROG); return raw?JSON.parse(raw):{}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(LS_PROG,JSON.stringify(p)); }catch(e){} }

/* ================= DATE HELPERS ================= */
function dOnly(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function todayDate(){ return dOnly(new Date()); }
function parseYMD(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function toYMD(d){ var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function dayNumFor(d){ if(!startDateStr) return null; var start=dOnly(parseYMD(startDateStr)); return Math.round((dOnly(d)-start)/86400000)+1; }
var MONTH_NAMES_TR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function humanDate(d){ return d.getDate()+" "+MONTH_NAMES_TR[d.getMonth()]; }
function phaseForN(n){ if(n==null||n<1) return null; if(n<=30) return MONTHS[0]; if(n<=60) return MONTHS[1]; if(n<=90) return MONTHS[2]; return "done"; }

/* ================= PROGRESS LOGIC ================= */
function dayDefFor(dateObj){
  var n=dayNumFor(dateObj); var phase=phaseForN(n);
  if(!phase||phase==="done") return null;
  var wk=WK_KEYS[dateObj.getDay()];
  return {n:n,phase:phase,wk:wk,def:phase.days[wk]};
}
function isDayFull(dateObj){
  var info=dayDefFor(dateObj); if(!info) return false;
  var def=info.def;
  if(def.restday) return true;
  var blocks=def.blocks;
  if(!blocks||blocks.length===0) return true;
  var rec=progress[toYMD(dateObj)];
  var sets=(rec&&rec.sets)||{};
  for(var i=0;i<blocks.length;i++){ if((sets[i]||0) < (blocks[i].sets||1)) return false; }
  return true;
}
function advanceSet(idx){
  var info=dayDefFor(todayDate()); if(!info||info.def.restday) return;
  var block=info.def.blocks[idx]; if(!block) return;
  var total=block.sets||1;
  var t=toYMD(todayDate());
  if(!progress[t]) progress[t]={sets:{}};
  if(!progress[t].sets) progress[t].sets={};
  var cur=progress[t].sets[idx]||0;
  progress[t].sets[idx]=(cur+1)%(total+1);
  saveProgress(progress);
  render();
}
function toggleCompleteToday(){
  var info=dayDefFor(todayDate()); if(!info||info.def.restday) return;
  var t=toYMD(todayDate());
  var blocks=info.def.blocks;
  var full=isDayFull(todayDate());
  var newSets={};
  if(!full){ for(var i=0;i<blocks.length;i++) newSets[i]=blocks[i].sets||1; }
  progress[t]={sets:newSets};
  saveProgress(progress);
  render();
}
function computeStreak(){
  var d=todayDate();
  if(!isDayFull(d)) d=addDays(d,-1);
  var streak=0;
  while(dayNumFor(d)>=1){
    if(isDayFull(d)){ streak++; d=addDays(d,-1); } else break;
  }
  return streak;
}

  var done=achieved>=total;
  var html='<div class="exrow'+(done?' done':'')+'">';
  html+='<div class="exrow-top">';

  html+='<div class="exname">'+b.name+'</div>';
  html+='<div class="exdetail">'+b.detail+'</div>';

  html+='<div class="exmeta">';
  if(b.rest>0) html+='<button type="button" class="rest-btn" data-rest="'+b.rest+'">⏱ '+b.rest+' sn dinlenme</button>';
  html+='<a class="ytbtn" href="'+ytUrl(b.yt||b.name)+'" target="_blank" rel="noopener"><svg class="yicon" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.8-.5-5.6c-.3-1-1-1.8-2-2C18.7 4 12 4 12 4s-6.7 0-8.5.4c-1 .2-1.7 1-2 2C1 8.2 1 12 1 12s0 3.8.5 5.6c.3 1 1 1.7 2 2C5.3 20 12 20 12 20s6.7 0 8.5-.4c1-.3 1.7-1 2-2 .5-1.8.5-5.6.5-5.6zM9.8 15.5v-7l6 3.5-6 3.5z"/></svg>YouTube</a>';
  html+='</div></div></div>';
  if(interactive){
    if(total>1){
      html+='<div class="setpips">';
      for(var p=0;p<total;p++) html+='<div class="pip'+(p<achieved?' filled':'')+'"></div>';
      html+='</div>';
    }
    var label = done ? "GÖREV TAMAMLANDI ✓" : MARCH_WORDS[idx%MARCH_WORDS.length];
    var progressTxt = total>1 ? (achieved+" / "+total+" SET") : (done ? "TAMAM" : "DOKUN");
    html+='<button type="button" class="advance-btn" data-idx="'+idx+'"><span>'+label+'</span><span class="ab-progress">'+progressTxt+(done?' · sıfırla':'')+'</span></button>';
  }
  html+='</div>';
  return html;
}

function renderToday(){
  var t=todayDate();
  var n=dayNumFor(t);
  if(n===null){ return renderNoStart(); }
  if(n<1){
    return '<div class="card future-card"><div class="fi">⏳</div><h3 style="margin:10px 0 6px;">Programın '+(1-n)+' gün sonra başlıyor</h3><p style="font-size:13px;color:var(--text-dim);">Başlangıç tarihi: '+humanDate(parseYMD(startDateStr))+'</p></div>';
  }
  var phase=phaseForN(n);
  if(phase==="done"){
    return '<div class="card done-card"><div class="fi">🏁</div><h3 style="margin:10px 0 6px;">Program Tamamlandı!</h3><p style="font-size:13px;color:var(--text-dim);">90 günlük protokolü bitirdin. İlerleme sekmesinden özetine bakabilirsin.</p></div>';
  }
  var wk=WK_KEYS[t.getDay()];
  var def=phase.days[wk];
  var pct=Math.round((Math.min(n,90)/90)*100);
  var streak=computeStreak();

  var html='<div class="hero"><div class="hero-top">';
  html+='<div><div class="hero-daynum">GÜN '+n+'<span style="font-size:16px;opacity:.7;">/90</span></div><div class="hero-sub">'+WK_NAMES[wk]+' · '+humanDate(t)+'</div></div>';
  html+='<div style="text-align:right;"><div class="hero-phase">'+phase.title.toUpperCase()+'</div><div class="hero-sub">Yelek: '+phase.vest+'</div></div>';
  html+='</div><div class="progressbar"><i style="width:'+pct+'%"></i></div>';
  html+='<div class="stat-row">';
  html+='<div class="stat-chip"><b>'+streak+'</b><span>Gün Seri</span></div>';
  html+='<div class="stat-chip"><b>'+(90-n+1)+'</b><span>Gün Kaldı</span></div>';
  html+='<div class="stat-chip"><b>'+phase.id+'/3</b><span>Faz</span></div>';
  html+='</div></div>';

  html+='<div class="section-title"><h2>Bugünün Antrenmanı</h2><span class="pill">'+WK_SHORT[wk]+'</span></div>';

  if(def.restday){
    html+='<div class="card restday-card">'+icon("rest")+'<h3>Tam Dinlenme Günü</h3><p>'+def.note+'</p></div>';
  }else{
    html+='<div class="card" style="padding:14px;"><div class="daytype">'+def.type+'</div>';
    if(def.note) html+='<div class="day-note">'+def.note+'</div>';
    html+='<div class="exlist">';
    for(var i=0;i<def.blocks.length;i++) html+=renderExRow(def.blocks[i],i,true);
    html+='</div>';
    var full=isDayFull(t);
    html+='<button class="btn '+(full?'ghost':'primary')+'" style="width:100%;margin-top:14px;" data-action="complete-day">'+(full?'✓ Bugünkü Antrenman Tamamlandı':'Günü Tamamla')+'</button>';
    html+='</div>';
  }
  return html;
}
function renderNoStart(){

/* ================= RENDER: PROGRAM ================= */
function renderProgram(){
  var today=todayDate();
  var todayN=dayNumFor(today);
  var todayWk=WK_KEYS[today.getDay()];
  var phase=MONTHS[currentMonth-1];
  var html='<div class="segmented">';
  MONTHS.forEach(function(m){ html+='<button type="button" class="month-tab'+(m.id===currentMonth?' active':'')+'" data-month="'+m.id+'">'+m.title+'</button>'; });
  html+='</div>';
  html+='<div class="card month-info"><div class="eyebrow">'+phase.range+' · Yelek '+phase.vest+'</div><h3>'+phase.subtitle+'</h3><p>'+phase.goal+'</p></div>';

  DAY_ORDER.forEach(function(wk){
    var def=phase.days[wk];
    var isToday=(todayN!=null && phaseForN(todayN)===phase && todayWk===wk);
    var openDefault = isToday || (wk===DAY_ORDER[0] && !(todayN!=null && phaseForN(todayN)===phase));
    html+='<div class="card daycard'+(isToday?' today':'')+(openDefault?' open':'')+'" data-day="'+wk+'">';
    html+='<div class="day-head"><div class="dh-left"><div class="day-badge">'+WK_SHORT[wk]+'</div><div><div class="dh-name">'+WK_NAMES[wk]+(isToday?' · Bugün':'')+'</div><div class="dh-type">'+def.type+'</div></div></div><div class="chev">▾</div></div>';
    html+='<div class="day-body"><div class="day-body-inner">';
    if(def.note) html+='<div class="day-note">'+def.note+'</div>';
    if(def.restday){
      html+='<div style="display:flex;align-items:center;gap:12px;padding:8px 0;">'+icon("rest")+'<div style="font-size:12.5px;color:var(--text-dim);">'+def.note+'</div></div>';
    }else{
      html+='<div class="exlist">';
      for(var i=0;i<def.blocks.length;i++) html+=renderExRow(def.blocks[i],i,false);
      html+='</div>';
    }
    html+='</div></div></div>';
  });
  return html;
}

/* ================= RENDER: PROGRESS ================= */
function renderProgress(){
  var today=todayDate();
  var n=dayNumFor(today);
  if(n===null) return renderNoStart();
  var streak=computeStreak();
  var doneCount=0, dotsHtml="";
  var start=dOnly(parseYMD(startDateStr));
  for(var i=1;i<=90;i++){
    var d=addDays(start,i-1);
    var wk=WK_KEYS[d.getDay()];
    var cls="dot";
    if(dOnly(d) > today){ cls+=" future"; }
    else if(wk==="paz"){ cls+=" rest"; }
    else if(i===n){ cls+= isDayFull(d)? " done":" today"; if(isDayFull(d)) doneCount++; }
    else { if(isDayFull(d)){ cls+=" done"; doneCount++; } else { cls+=" missed"; } }
    dotsHtml+='<div class="'+cls+'" title="Gün '+i+' · '+humanDate(d)+'"></div>';
  }
  var html='<div class="statgrid">';
  html+='<div class="card statcard"><b>'+doneCount+'</b><span>Tamamlanan Gün</span></div>';
  html+='<div class="card statcard"><b>'+streak+'</b><span>Güncel Seri</span></div>';
  html+='<div class="card statcard"><b>'+Math.min(n,90)+'/90</b><span>Gün</span></div>';
  html+='</div>';

  html+='<div class="section-title"><h2>Faz İlerlemesi</h2></div><div class="card phasebars">';
  MONTHS.forEach(function(m){
    var rangeStart=(m.id-1)*30+1, rangeEnd=m.id*30, total=0, done2=0;
    for(var j=rangeStart;j<=rangeEnd;j++){
      var dd=addDays(start,j-1);
      var wkj=WK_KEYS[dd.getDay()];
      if(wkj==="paz") continue;
      total++;
      if(dOnly(dd)<=today && isDayFull(dd)) done2++;
    }
    var pct=total? Math.round(done2/total*100):0;
    html+='<div class="phaserow"><div class="pr-top"><span>'+m.title+' — '+m.subtitle+'</span><span>'+done2+'/'+total+'</span></div><div class="pr-track"><i style="width:'+pct+'%"></i></div></div>';
  });
  html+='</div>';

  html+='<div class="section-title"><h2>90 Günlük Harita</h2></div>';
  html+='<div class="card"><div class="dotgrid">'+dotsHtml+'</div><div class="legend">';
  html+='<span><i style="background:var(--success);"></i>Tamamlandı</span>';
  html+='<span><i style="background:var(--accent);"></i>Bugün</span>';
  html+='<span><i style="background:var(--danger-bg);border:1px solid var(--danger);"></i>Kaçırıldı</span>';
  html+='<span><i style="background:transparent;border:1px dashed var(--line);"></i>Dinlenme</span>';
  html+='<span><i style="background:var(--surface-2);border:1px solid var(--line);opacity:.6;"></i>Gelecek</span>';
  html+='</div></div>';
  return html;
}

/* ================= MASTER RENDER ================= */
var viewEl=document.getElementById("view");
function render(){
  document.querySelectorAll(".navbtn").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===currentTab); });
  if(!startDateStr){ document.getElementById("onboarding").hidden=false; }
  var html="";
  if(currentTab==="today") html=renderToday();
  else if(currentTab==="program") html=renderProgram();
  else if(currentTab==="progress") html=renderProgress();
  viewEl.innerHTML=html;
}

/* ================= REST TIMER ================= */
var audioCtx=null;
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.4);
    o.start(); o.stop(audioCtx.currentTime+0.42);
  }catch(e){}
}
function startRest(btn){
  if(btn.dataset.running==="1") return;
  var secs=parseInt(btn.dataset.rest,10); if(!secs) return;
  var orig=btn.textContent;
  btn.dataset.running="1"; btn.classList.add("running");
  var remain=secs;
  function tick(){
    if(remain<=0){
      clearInterval(iv); btn.dataset.running="0"; btn.classList.remove("running"); btn.classList.add("done-flash");
      btn.textContent="✓ Bitti"; beep();
      setTimeout(function(){ btn.textContent=orig; btn.classList.remove("done-flash"); },1600);
      return;
    }
    btn.textContent="⏱ "+remain+" sn"; remain--;
  }
  tick();
  var iv=setInterval(tick,1000);
}

/* ================= EVENTS ================= */
viewEl.addEventListener("click", function(e){
  var restBtn=e.target.closest(".rest-btn"); if(restBtn){ startRest(restBtn); return; }
  var advBtn=e.target.closest(".advance-btn"); if(advBtn){ advanceSet(+advBtn.dataset.idx); return; }
  var head=e.target.closest(".day-head"); if(head){ head.closest(".daycard").classList.toggle("open"); return; }
  var mtab=e.target.closest(".month-tab"); if(mtab){ currentMonth=+mtab.dataset.month; render(); return; }
  var cbtn=e.target.closest('[data-action="complete-day"]'); if(cbtn){ toggleCompleteToday(); return; }
});
document.querySelectorAll(".navbtn").forEach(function(b){
  b.addEventListener("click", function(){ currentTab=b.dataset.tab; render(); });
});

/* settings / onboarding */
var onboarding=document.getElementById("onboarding");
var settingsSheet=document.getElementById("settingsSheet");
var startDateInput=document.getElementById("startDateInput");
var settingsDateInput=document.getElementById("settingsDateInput");

document.getElementById("startProgramBtn").addEventListener("click", function(){
  var v=startDateInput.value || toYMD(todayDate());
  startDateStr=v; saveStart(v);
  onboarding.hidden=true;
  render();
});
document.getElementById("settingsBtn").addEventListener("click", function(){
  settingsDateInput.value = startDateStr || toYMD(todayDate());
  document.getElementById("resetConfirm").hidden=true;
  settingsSheet.hidden=false;
});
document.getElementById("closeSettingsBtn").addEventListener("click", function(){ settingsSheet.hidden=true; });
document.getElementById("saveSettingsBtn").addEventListener("click", function(){
  var v=settingsDateInput.value; if(!v) return;
  startDateStr=v; saveStart(v);
  settingsSheet.hidden=true;
  render();
});
var resetArmed=false;
document.getElementById("resetBtn").addEventListener("click", function(){
  var confirmEl=document.getElementById("resetConfirm");
  if(!resetArmed){ resetArmed=true; confirmEl.hidden=false; setTimeout(function(){resetArmed=false;confirmEl.hidden=true;},4000); return; }
  progress={}; saveProgress(progress);
  try{ localStorage.removeItem(LS_START); }catch(e){}
  startDateStr=null;
  settingsSheet.hidden=true;
  render();
  onboarding.hidden=false;
});

/* init */
startDateInput.value=toYMD(todayDate());
render();
})();
</script>
